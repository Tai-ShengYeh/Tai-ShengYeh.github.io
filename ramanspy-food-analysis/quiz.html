<style>
/* ============================================================
   RamanSPy × 食品分析
   視覺系統沿用 tai-shengyeh.github.io/raman-food-analysis/teaching.html
   （湖綠封面 / 米色卡片 / coral · gold 強調 / 圓角 14–16px）
   ============================================================ */
:root{
  --paper:#FFFFFF; --paper2:#F5F2E9; --ink:#1A1A1A; --ink-soft:#52493b;
  --teal:#0E7C7B; --coral:#E36414; --gold:#C8941F; --line:#E4DECC;
  --cover:#119C9A;
  --violet:#6A4C93;   /* 第四分類色：判讀單元 */
  --mono:'JetBrains Mono','Fira Code',Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;
  color:var(--ink);background:var(--paper);line-height:1.65;font-size:18px;}
h1,h2,h3{font-weight:900;line-height:1.2;letter-spacing:.01em}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
code,pre,kbd{font-family:var(--mono)}
img{max-width:100%}

/* ---------- 導覽 ---------- */
nav{position:sticky;top:0;z-index:50;background:rgba(26,26,26,.96);backdrop-filter:blur(6px);
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 22px;}
nav .brand{color:#fff;font-weight:900;font-size:18px;margin-right:auto}
nav .brand b{color:var(--gold)}
nav a{color:#e9e4d6;font-weight:700;font-size:14.5px;padding:6px 11px;border-radius:8px}
nav a:hover{background:rgba(255,255,255,.12);text-decoration:none;color:#fff}
nav a.on{background:rgba(255,255,255,.16);color:#fff}

/* ---------- 封面 ---------- */
.hero{background:var(--cover);color:#fff;padding:78px 22px 64px;text-align:center}
.hero h1{font-size:clamp(32px,6vw,62px);margin:0 0 14px}
.hero h1 .accent{color:#FFDE7A}
.hero p.sub{font-size:clamp(17px,2.4vw,23px);color:rgba(255,255,255,.9);font-weight:700;
  max-width:820px;margin:0 auto 28px}
.hero .facts{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.hero .fact b{display:block;font-size:30px;color:#FFDE7A;font-weight:900;line-height:1.2}
.hero .fact span{font-size:13px;color:rgba(255,255,255,.85);font-weight:500}
.hero .btnrow{justify-content:center}

/* ---------- 版面 ---------- */
main{max-width:1080px;margin:0 auto;padding:0 22px}
section{padding:64px 0 8px;scroll-margin-top:70px;border-top:1px solid var(--line)}
section:first-of-type{border-top:none}
.kicker{color:var(--coral);font-weight:900;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
section h2{font-size:clamp(27px,4vw,40px);margin:6px 0 8px}
section h3{font-size:22px;margin:34px 0 10px;color:var(--teal)}
section h4{font-size:18px;margin:24px 0 6px;font-weight:900}
p{margin:14px 0}
.lead{font-size:20px;color:var(--ink-soft)}
ul,ol{padding-left:1.25em}
li{margin:6px 0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin:24px 0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:22px 24px;
  display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.08)}
.card .tag{display:inline-block;align-self:flex-start;font-size:12px;font-weight:900;color:#fff;
  background:var(--teal);border-radius:999px;padding:3px 11px;margin-bottom:10px}
.card .tag.coral{background:var(--coral)} .card .tag.gold{background:var(--gold)}
.card .tag.violet{background:var(--violet)}
.card h3{font-size:22px;margin:0 0 6px}
.card .links{margin-top:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.card .go{font-weight:900;color:var(--coral)}
.card .repo{font-size:13px;color:var(--ink-soft)}
.card h4{margin:0 0 8px;font-size:19px;font-weight:900;color:var(--teal)}
.card.coral h4{color:var(--coral)}
.card.gold h4{color:var(--gold)}
.card.violet h4{color:var(--violet)}
.card .icon{font-size:1.9rem;line-height:1;margin-bottom:8px}
.card ul{margin:8px 0 0;padding-left:1.1em}
.card li{margin:4px 0;font-size:16px}
.card .big{font-size:38px;font-weight:900;color:var(--coral);line-height:1;margin:4px 0 6px}
.card .note{font-size:14px;color:var(--ink-soft);margin-top:10px}
a.card{display:block;color:inherit;transition:transform .16s ease, box-shadow .16s ease}
a.card:hover{text-decoration:none;transform:translateY(-3px);box-shadow:0 14px 30px -20px rgba(26,26,26,.6)}

figure{margin:26px 0;background:var(--paper2);border:1px solid var(--line);border-radius:16px;
  padding:14px;text-align:center}
figure img{max-width:100%;height:auto;border-radius:8px;display:block;margin:0 auto;background:#fff}
figure svg{max-width:100%;height:auto;display:block;margin:0 auto}
figcaption{font-size:15px;color:var(--ink-soft);font-weight:700;margin-top:10px;text-align:left}
figcaption b{color:var(--coral)}

.callout{border-left:6px solid var(--teal);background:var(--paper2);border-radius:0 14px 14px 0;
  padding:18px 22px;margin:24px 0;font-size:18px}
.callout.coral{border-color:var(--coral)}
.callout.gold{border-color:var(--gold)}
.callout .tag{font-weight:900;color:var(--teal)}
.callout.coral .tag{color:var(--coral)}
.callout.gold .tag{color:var(--gold)}
.callout p:first-child{margin-top:0}
.callout p:last-child{margin-bottom:0}

pre{background:#1f2329;border-radius:14px;padding:0;margin:18px 0;overflow:auto;border:1px solid #2c313a}
pre code{display:block;padding:20px 22px;font-size:14.5px;line-height:1.6;background:transparent}
.codecap{font-size:14px;font-weight:700;color:var(--ink-soft);margin:20px 0 -8px}
.codecap b{color:var(--teal)}
details{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:6px 18px;margin:14px 0}
summary{font-weight:900;cursor:pointer;padding:10px 0;color:var(--teal)}

table{width:100%;border-collapse:collapse;margin:24px 0;font-size:16.5px;background:var(--paper2);
  border-radius:14px;overflow:hidden}
th,td{padding:12px 15px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--teal);color:#fff;font-weight:900}
tr:last-child td{border-bottom:none}
td b.teal{color:var(--teal)} td b.coral{color:var(--coral)} td b.gold{color:var(--gold)}
td.yes{color:var(--teal);font-weight:900} td.no{color:var(--coral);font-weight:900}
td .wn{font-family:var(--mono);font-weight:700}
.tablewrap{overflow-x:auto}

.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
.btn{background:var(--teal);color:#fff;font-weight:900;padding:12px 20px;border-radius:12px;
  font-size:15px;display:inline-block;border:none;cursor:pointer;font-family:inherit}
.btn.coral{background:var(--coral)}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.btn:hover{text-decoration:none;opacity:.92}
.hero .btn{background:#fff;color:var(--cover)}
.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}

.eq{background:var(--paper2);border:1px dashed var(--teal);border-radius:12px;padding:14px 18px;
  margin:18px 0;text-align:center;font-size:20px}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{position:relative;padding:10px 0 10px 46px;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:none}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;
  width:30px;height:30px;background:var(--teal);color:#fff;border-radius:50%;font-weight:900;
  display:flex;align-items:center;justify-content:center;font-size:15px}

footer{background:var(--ink);color:#cfc8b6;text-align:center;padding:34px 22px;margin-top:56px;font-size:13.5px}
footer b{color:var(--gold)}
footer a{color:#9fd3d2}

/* ============================================================
   互動元件
   ============================================================ */
.lab{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:26px 0}
.lab-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.lab-head .chip{background:var(--coral);color:#fff;font-weight:900;font-size:13px;
  letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:8px}
.lab-head h4{margin:0;font-size:19px;font-weight:900}
.lab .hint{font-size:15px;color:var(--ink-soft);margin:4px 0 14px}
.lab-body{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}
.lab-body.wide{grid-template-columns:1fr}
.controls{display:flex;flex-direction:column;gap:12px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;
  font-size:14.5px;font-weight:700;gap:8px}
.ctl label .val{font-family:var(--mono);font-weight:700;color:var(--coral);font-size:14px}
.ctl input[type=range]{width:100%;accent-color:var(--teal);margin-top:2px}
.ctl.switch{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:700}
.ctl.switch input{accent-color:var(--teal);width:17px;height:17px}
.canvas-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:250px}
.readout{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.readout div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;flex:1;min-width:120px}
.readout b{display:block;font-family:var(--mono);font-size:19px;font-weight:700;line-height:1.3}
.readout span{font-size:12.5px;color:var(--ink-soft);font-weight:700}
.readout .t-teal b{color:var(--teal)} .readout .t-coral b{color:var(--coral)} .readout .t-gold b{color:var(--gold)}
.verdict-box{margin-top:12px;padding:13px 17px;border-radius:12px;font-weight:900;font-size:16.5px;
  border:2px solid var(--line);background:#fff}
.verdict-box.hit{border-color:var(--coral);color:var(--coral);background:#fdf1e9}
.verdict-box.miss{border-color:var(--teal);color:var(--teal);background:#e9f4f4}
.choices{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.choices button{background:#fff;border:2px solid var(--line);border-radius:11px;padding:9px 15px;
  font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);transition:border-color .14s}
.choices button:hover{border-color:var(--teal)}
.choices button.right{border-color:var(--teal);background:#e9f4f4;color:var(--teal)}
.choices button.wrong{border-color:var(--coral);background:#fdf1e9;color:var(--coral)}
.feedback{margin-top:12px;font-size:15.5px;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:12px 16px;display:none}
.feedback.show{display:block}

/* ---------- 測驗 ---------- */
.q{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
.q .qn{font-family:var(--mono);font-size:13px;color:var(--ink-soft);font-weight:700;letter-spacing:.1em}
.q .qt{font-weight:700;margin:6px 0 12px;font-size:17px}
.q .qt:empty{display:none}
.q pre{margin:6px 0 12px}
.opt{display:block;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 15px;
  margin:8px 0;cursor:pointer;font-size:16px;transition:border-color .14s}
.opt:hover{border-color:var(--teal)}
.opt input{margin-right:10px;accent-color:var(--teal)}
.opt.right{border-color:var(--teal);background:#e9f4f4}
.opt.wrong{border-color:var(--coral);background:#fdf1e9}
.q.done .opt{cursor:default}
.fb{display:none;margin-top:12px;background:#fff;border:1px solid var(--line);
  border-left:5px solid var(--teal);border-radius:0 12px 12px 0;padding:13px 17px;font-size:16px}
.q.done .fb{display:block}
.fb.no{border-left-color:var(--coral)}
.fb b{font-weight:900;color:var(--teal)}
.fb.no b{color:var(--coral)}
.stage-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.stage-head .badge{background:var(--teal);color:#fff;font-weight:900;font-size:13px;
  letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:9px}
.stage-head .badge.coral{background:var(--coral)}
.stage-head .badge.gold{background:var(--gold)}
.stage-head .badge.violet{background:var(--violet)}
.stage-head h3{margin:0;color:var(--ink);font-size:22px}
.stage-head .from{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-soft);font-weight:700}
.submitbar{position:sticky;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:13px 22px;z-index:40;margin-top:26px}
.submitbar .inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.progress{flex:1;min-width:130px;height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .35s}
.pcount{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink-soft)}
.result{display:none;background:var(--paper2);border:1px solid var(--line);border-radius:16px;
  padding:28px;margin:30px 0}
.result.show{display:block}
.score{font-family:var(--mono);font-size:clamp(44px,9vw,68px);font-weight:700;line-height:1;color:var(--teal)}
.verdict{font-weight:900;font-size:21px;margin:12px 0 20px}
.bar{display:grid;grid-template-columns:160px 1fr 64px;gap:13px;align-items:center;margin:11px 0;font-size:16px}
.bar .track{height:11px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--teal);border-radius:6px;transition:width .7s ease}
.bar .num{font-family:var(--mono);font-size:15px;text-align:right;font-weight:700}

@media(max-width:860px){
  .lab-body{grid-template-columns:1fr}
}
@media(max-width:760px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  body{font-size:17px}
  .bar{grid-template-columns:1fr 58px}
  .bar .track{grid-column:1/-1;order:3}
  nav{padding:8px 14px}
  nav .brand{font-size:16px;width:100%;margin-bottom:4px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}

/* 文獻引註上標 */
a.ref{font-size:.72em;font-weight:900;color:var(--coral);vertical-align:super;
  text-decoration:none;padding:0 1px}
a.ref:hover{text-decoration:underline}
#refs ol{padding-left:1.6em}
#refs ol li{margin:10px 0;line-height:1.6}
#refs ol li i{color:var(--ink-soft)}

</style>
</head>

<script>
const STAGES = [
  {id:"s1", cls:"", badge:"關卡一", title:"原理與第一條光譜", from:"教材：原理 · 合成光譜", nb:"NB1_intro_spectrum.ipynb", link:"teaching.html#principle", qs:[
    {q:"拉曼位移（Raman shift）的數值，會不會隨著使用的雷射波長改變？",
     o:["會，換雷射就要重新查表","不會，因為它是入射光與散射光的能量差","只有在 785 nm 以上才會改變","跟雷射無關，但跟樣品溫度成正比"],a:1,

    {q:"某同學說：「A 樣品的 1085 峰高 3200，B 樣品只有 1800，所以 A 的醣類比較多。」這句話的問題在哪？",
     o:["1085 不是醣類的峰","峰高本來就跟濃度無關，永遠不能用","Y 軸是任意單位，受雷射功率與對焦影響，未歸一化不能比","應該比較峰的位置而不是高度"],a:2,
     e:"強度單位是 a.u.（任意單位）。要比較必須先做歸一化，最好再用一個穩定的內標峰（例如 1441 或 1003）做比值。"},
    {q:"下列哪一個特徵最能判斷某個尖銳訊號是「宇宙射線」而不是真正的拉曼峰？",

const TOTAL = STAGES.reduce((n,s)=>n+s.qs.length,0);
let answers = {};

function esc(t){
  return t.replace(/<C>([\s\S]*?)<\/C>/g, (m,c)=>'<code>'+c+'</code>')
          .replace(/<CODE>([\s\S]*?)<\/CODE>/g, (m,c)=>'</p><pre><code class="language-python">'+c.trim()+'</code></pre><p class="qt">');
}

function render(){
  const root = document.getElementById('quiz');
  root.innerHTML = '';
  let n = 0;
  STAGES.forEach(st=>{
    const sec = document.createElement('section');
    sec.innerHTML = '<div class="stage-head"><span class="badge '+(st.cls||'')+'">'+st.badge+'</span>'+
      '<h3>'+st.title+'</h3><span class="from">'+st.from+'</span></div>';
    st.qs.forEach((item, i)=>{
      n++;
      const key = st.id+'_'+i;
      const div = document.createElement('div');
      div.className = 'q';
      div.dataset.key = key; div.dataset.stage = st.id;
      let html = '<div class="qn">Q'+String(n).padStart(2,'0')+'</div><p class="qt">'+esc(item.q)+'</p>';
      item.o.forEach((opt, j)=>{
        html += '<label class="opt" data-i="'+j+'"><input type="radio" name="'+key+'" value="'+j+'">'+opt+'</label>';
      });
      html += '<div class="fb"></div>';
      div.innerHTML = html;
      div.querySelectorAll('input').forEach(inp=>{
        inp.addEventListener('change', ()=>choose(div, item, parseInt(inp.value)));
      });
      sec.appendChild(div);
    });
    root.appendChild(sec);
  });
  if (window.hljs) hljs.highlightAll();
  updateProgress();
}

function choose(div, item, picked){
  if(div.classList.contains('done')) return;
  div.classList.add('done');
  answers[div.dataset.key] = {stage: div.dataset.stage, ok: picked === item.a};
  div.querySelectorAll('.opt').forEach(l=>{
    const i = parseInt(l.dataset.i);
    if(i === item.a) l.classList.add('right');
    else if(i === picked) l.classList.add('wrong');
    l.querySelectorAll('input').forEach(x=>x.disabled = true);
  });
  const fb = div.querySelector('.fb');
  fb.className = 'fb ' + (picked === item.a ? '' : 'no');
  fb.innerHTML = '<b>'+(picked === item.a ? '答對了' : '再想一下')+'</b><br>'+item.e;
  updateProgress();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  document.getElementById('pcount').textContent = '已作答 '+done+' / '+TOTAL;
  document.getElementById('pbar').style.width = (done/TOTAL*100)+'%';
}

document.getElementById('submit').addEventListener('click', ()=>{
  const done = Object.keys(answers).length;
  if(done < TOTAL){
    alert('還有 '+(TOTAL-done)+' 題沒作答。全部答完才能計分。');
    const first = document.querySelector('.q:not(.done)');
    if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  const per = {};
  STAGES.forEach(s=> per[s.id] = {right:0, total:s.qs.length});
  let right = 0;
  Object.values(answers).forEach(a=>{ if(a.ok){ right++; per[a.stage].right++; } });
  const score = Math.round(right/TOTAL*100);

  document.getElementById('score').textContent = score + ' 分';
  const v = document.getElementById('verdict');
  if(score >= 90) v.textContent = '通過 —— 你已經可以獨立判讀一份食品拉曼報告了。';
  else if(score >= 70) v.textContent = '通過 —— 觀念站穩了，把下面標示的關卡再看一次會更紮實。';
  else v.textContent = '尚未通過（門檻 70 分）—— 回去複習下面列出的段落，再重做一次。';

  document.getElementById('bars').innerHTML = STAGES.map(s=>{
    const p = per[s.id], pct = Math.round(p.right/p.total*100);
    return '<div class="bar"><span>'+s.title+'</span>'+
      '<span class="track"><i style="width:'+pct+'%"></i></span>'+
      '<span class="num">'+p.right+'/'+p.total+'</span></div>';
  }).join('');

  const weak = STAGES.filter(s=> per[s.id].right/per[s.id].total < 0.7);
  document.getElementById('advice').innerHTML = weak.length === 0
    ? '<span class="tag">下一步</span>　每一關都在 70% 以上。拿 <code>unknown_samples.csv</code> 的六個未知樣品寫一份書面判讀報告，每個結論都要指出你倚靠的是哪一個波數、以及你怎麼排除其他可能。'
    : '<span class="tag">建議優先複習</span><ul>' + weak.map(s=>
        '<li>「'+s.title+'」→ <a href="'+s.link+'">回教材對應段落</a>，並重跑 <code>'+s.nb+'</code></li>').join('') + '</ul>';

  const r = document.getElementById('result');
  r.classList.add('show');
  r.scrollIntoView({behavior:'smooth'});
});

document.getElementById('reset').addEventListener('click', ()=>{
  answers = {};
  document.getElementById('result').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});

render();
</script>
