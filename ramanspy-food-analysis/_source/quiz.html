    {q:"把一個奶粉樣品丟進「四種食用油」的分類模型，會發生什麼？實務上該怎麼防？",
     o:["模型會回報「無法辨識」，不需額外處理","模型會硬歸到四類油之一且可能給出高信心值，需加上適用範圍（applicability domain）檢查","模型會直接報錯中斷","模型會自動新增第五類"],a:1,
     e:"分類模型只會在學過的類別裡挑一個 —— 它不會說「我不知道」。實務上要用光譜殘差或馬氏距離判斷樣品是否落在訓練集範圍內。"}
  ]}
];


const TOTAL = STAGES.reduce((n,s)=>n+s.qs.length,0);
let answers = {};

function esc(t){
  return t.replace(/<C>([\s\S]*?)<\/C>/g, (m,c)=>'<code>'+c+'</code>')
          .replace(/<CODE>([\s\S]*?)<\/CODE>/g, (m,c)=>'</p><pre><code class="language-python">'+c.trim()+'</code></pre><p class="qt">');
}

function render(){
  const root = document.getElementById('quiz');
  root.innerHTML = '';
  let n = 0;
  STAGES.forEach(st=>{
    const sec = document.createElement('section');
    sec.innerHTML = '<div class="stage-head"><span class="badge '+(st.cls||'')+'">'+st.badge+'</span>'+
      '<h3>'+st.title+'</h3><span class="from">'+st.from+'</span></div>';
    st.qs.forEach((item, i)=>{
      n++;
      const key = st.id+'_'+i;
      const div = document.createElement('div');
      div.className = 'q';
      div.dataset.key = key; div.dataset.stage = st.id;
      let html = '<div class="qn">Q'+String(n).padStart(2,'0')+'</div><p class="qt">'+esc(item.q)+'</p>';
      item.o.forEach((opt, j)=>{
        html += '<label class="opt" data-i="'+j+'"><input type="radio" name="'+key+'" value="'+j+'">'+opt+'</label>';
      });
      html += '<div class="fb"></div>';
      div.innerHTML = html;
      div.querySelectorAll('input').forEach(inp=>{
        inp.addEventListener('change', ()=>choose(div, item, parseInt(inp.value)));
      });
      sec.appendChild(div);
    });
    root.appendChild(sec);
  });
  if (window.hljs) hljs.highlightAll();
  updateProgress();
}

function choose(div, item, picked){
  if(div.classList.contains('done')) return;
  div.classList.add('done');
  answers[div.dataset.key] = {stage: div.dataset.stage, ok: picked === item.a};
  div.querySelectorAll('.opt').forEach(l=>{
    const i = parseInt(l.dataset.i);
    if(i === item.a) l.classList.add('right');
    else if(i === picked) l.classList.add('wrong');
    l.querySelectorAll('input').forEach(x=>x.disabled = true);
  });
  const fb = div.querySelector('.fb');
  fb.className = 'fb ' + (picked === item.a ? '' : 'no');
  fb.innerHTML = '<b>'+(picked === item.a ? '答對了' : '再想一下')+'</b><br>'+item.e;
  updateProgress();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  document.getElementById('pcount').textContent = '已作答 '+done+' / '+TOTAL;
  document.getElementById('pbar').style.width = (done/TOTAL*100)+'%';
}

document.getElementById('submit').addEventListener('click', ()=>{
  const done = Object.keys(answers).length;
  if(done < TOTAL){
    alert('還有 '+(TOTAL-done)+' 題沒作答。全部答完才能計分。');
    const first = document.querySelector('.q:not(.done)');
    if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  const per = {};
  STAGES.forEach(s=> per[s.id] = {right:0, total:s.qs.length});
  let right = 0;
  Object.values(answers).forEach(a=>{ if(a.ok){ right++; per[a.stage].right++; } });
  const score = Math.round(right/TOTAL*100);

  document.getElementById('score').textContent = score + ' 分';
  const v = document.getElementById('verdict');
  if(score >= 90) v.textContent = '通過 —— 你已經可以獨立判讀一份食品拉曼報告了。';
  else if(score >= 70) v.textContent = '通過 —— 觀念站穩了，把下面標示的關卡再看一次會更紮實。';
  else v.textContent = '尚未通過（門檻 70 分）—— 回去複習下面列出的段落，再重做一次。';

  document.getElementById('bars').innerHTML = STAGES.map(s=>{
    const p = per[s.id], pct = Math.round(p.right/p.total*100);
    return '<div class="bar"><span>'+s.title+'</span>'+
      '<span class="track"><i style="width:'+pct+'%"></i></span>'+
      '<span class="num">'+p.right+'/'+p.total+'</span></div>';
  }).join('');

  const weak = STAGES.filter(s=> per[s.id].right/per[s.id].total < 0.7);
  document.getElementById('advice').innerHTML = weak.length === 0
    ? '<span class="tag">下一步</span>　每一關都在 70% 以上。拿 <code>unknown_samples.csv</code> 的六個未知樣品寫一份書面判讀報告，每個結論都要指出你倚靠的是哪一個波數、以及你怎麼排除其他可能。'
    : '<span class="tag">建議優先複習</span><ul>' + weak.map(s=>
        '<li>「'+s.title+'」→ <a href="'+s.link+'">回教材對應段落</a>，並重跑 <code>'+s.nb+'</code></li>').join('') + '</ul>';

  const r = document.getElementById('result');
  r.classList.add('show');
  r.scrollIntoView({behavior:'smooth'});
});

document.getElementById('reset').addEventListener('click', ()=>{
  answers = {};
  document.getElementById('result').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});

render();
</script>
</body>
</html>
